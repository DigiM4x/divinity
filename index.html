<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Divinity</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2ece0;
        --panel: rgba(12, 14, 20, 0.58);
        --edge: rgba(255, 255, 255, 0.14);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #05070c;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: radial-gradient(120% 100% at 50% 0%, #16213a 0%, #05070c 70%);
        transition: opacity 0.5s ease;
        text-align: center;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot h1 {
        margin: 0;
        font-size: clamp(34px, 7vw, 72px);
        font-weight: 200;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: #fff6df;
      }
      #boot p { margin: 0; opacity: 0.55; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; }
      /* The civilisation picker. Shown before the island is generated, because
         the island is vetted for a specific number of settlements. */
      #boot-civs { margin-top: 30px; display: none; }
      #boot-civs.on { display: block; }
      #boot-civs .ask { margin-bottom: 14px; opacity: 0.75; font-size: 13px;
        letter-spacing: 0.18em; text-transform: uppercase; }
      #boot-civs .row { display: flex; gap: 10px; justify-content: center; }
      #boot-civs button { font: inherit; font-size: 22px; width: 62px; height: 62px;
        color: #e8e6e1; background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.18); border-radius: 9px;
        cursor: pointer; transition: background .12s, border-color .12s, transform .12s; }
      #boot-civs button:hover { background: rgba(255,220,140,0.18);
        border-color: #ffe9b8; transform: translateY(-2px); }
      #boot-civs .hint { margin-top: 14px; font-size: 11px; opacity: 0.4;
        letter-spacing: 0.08em; min-height: 15px; text-transform: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="boot">
      <h1>DIVINITY</h1>
      <p id="boot-status">Shaping the island&hellip;</p>
      <div id="boot-civs">
        <div class="ask">How many civilizations?</div>
        <div class="row"></div>
        <div class="hint"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
